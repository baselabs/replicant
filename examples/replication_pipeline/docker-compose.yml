# The reference stack: Postgres source → replicant pipeline (one OTP release,
# one container) → Postgres destination, with a durable commit-LSN checkpoint.
# Throwaway local-example values throughout; ports bind to 127.0.0.1 ONLY.
#
#   docker compose up -d --build     # source + destination + pipeline
#   docker compose logs -f pipeline  # watch it stream
#   docker compose down -v           # teardown + wipe volumes
#
# Images are digest-pinned (the same digests the library's CI matrix pins) — a
# moved tag cannot silently change the tested substrate.

name: replicant-example

services:
  source-pg:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    # wal_level=logical is the load-bearing flag (a `services:` block in CI
    # cannot pass it); max_wal_senders/max_replication_slots mirror AGENTS.md.
    command:
      ["-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: example_src
    # TCP-forced pg_isready: the socket form answers "accepting connections"
    # during the entrypoint's init-SQL phase (its temp server is socket-only),
    # so only -h 127.0.0.1 proves the init scripts finished and the real
    # server is listening — probe-verified 2026-08-24 against postgres:18.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - source-data:/var/lib/postgresql
      - ./docker/source-init:/docker-entrypoint-initdb.d:ro

  dest-pg:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: example_dst
    volumes:
      - dest-data:/var/lib/postgresql
      - ./priv/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:15433:5432"

  pipeline:
    # Path dep on replicant: the build context is the repo root.
    build:
      context: ../..
      dockerfile: examples/replication_pipeline/Dockerfile
    environment:
      SOURCE_HOST: source-pg
      SOURCE_PORT: "5432"
      SOURCE_USER: replicant_reader
      SOURCE_DB: example_src
      DEST_HOST: dest-pg
      DEST_PORT: "5432"
      DEST_USER: postgres
      DEST_DB: example_dst
      REPLICANT_SLOT_NAME: replicant_example
      REPLICANT_PUBLICATION: example_pub
    depends_on:
      source-pg:
        condition: service_healthy
      dest-pg:
        condition: service_healthy
    # A fail-closed halt leaves the BEAM node up (ADR-0006), so "running" is
    # not "delivering": the rpc liveness check fails (container -> unhealthy
    # in `docker compose ps`) when the pipeline child is gone. Plain compose
    # does NOT auto-restart unhealthy services — the operator restarts with
    # intent, preserving the fail-closed posture. Known tradeoff: each probe
    # boots a short-lived peer VM (rpc), so keep the interval modest and the
    # timeout generous relative to peer-boot cost on a loaded host.
    healthcheck:
      test: ["CMD", "/app/bin/replication_pipeline", "rpc", "ReplicationPipeline.Health.healthy?()"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  source-data:
  dest-data:
