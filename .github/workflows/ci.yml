name: CI

# One qualification run per landing candidate (kimosabe ADR 0043). kimosabe-land pushes
# kci/<commit>; this run is the only verdict, and main moves to that commit only on its
# `qualified` check. A push to main, a tag or a release starts nothing here. Outside pull
# requests run the same jobs from pull-request.yml under other check names.
on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    uses: ./.github/workflows/qualification.yml

  # The verdict. Always runs, and fails unless every qualification job succeeded; a
  # skipped or cancelled job is a failure. The name `qualified` belongs to this job alone.
  qualified:
    if: always()
    needs: [qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PY
