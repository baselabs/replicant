name: CI

# One qualification run per landing candidate (kimosabe ADR 0043). kimosabe-land pushes
# kci/<commit>; this run is the only verdict, and main moves to that commit only on its
# `qualified` check. A push to main, a tag or a release starts nothing here.
# Fork changes are qualified only when a maintainer submits a landing candidate.
on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    # GitHub forbids timeout-minutes on reusable-workflow calls; each called job
    # has its measured timeout in qualification.yml, which also defines the rule.
    uses: ./.github/workflows/qualification.yml

  # The verdict. Always runs, and fails unless every qualification job succeeded; a
  # skipped or cancelled job is a failure. The name `qualified` belongs to this job alone.
  qualified:
    if: always()
    needs: [qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Green run 44200086214: qualified 0m06s
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PY
