name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.3"
  OTP_VERSION: "29"

jobs:
  test:
    name: test (PG${{ matrix.pg.major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # R05 supported-version matrix: PostgreSQL 15, 16, 17, 18. Each row uses the
      # operator-approved local port mapping (5615/5599/5617/5618) — `localhost:5432` is
      # never the substrate — and pins the image by manifest-list digest (supply-chain: a
      # moved tag cannot silently change the tested image). `major` is exported as
      # EXPECTED_PG_MAJOR so the integration suite fails a row wired to the wrong container.
      matrix:
        pg:
          - { major: "15", port: "5615", digest: "sha256:5f72c7b5bd616308ccfd2e74d6be16fb06364e5eecbb815fe9dc6ab9761d2111" }
          - { major: "16", port: "5599", digest: "sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5" }
          - { major: "17", port: "5617", digest: "sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449" }
          - { major: "18", port: "5618", digest: "sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941" }
    env:
      MIX_ENV: test
      REPLICANT_TEST_URL: postgres://postgres@localhost:${{ matrix.pg.port }}/postgres
      EXPECTED_PG_MAJOR: ${{ matrix.pg.major }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Start PostgreSQL ${{ matrix.pg.major }} with logical replication
        # A `services:` block cannot pass `-c wal_level=logical` to the container, so run
        # Postgres directly with the flags (mirrors AGENTS.md). Without wal_level=logical the
        # integration suite would silently skip and CI would be green-but-vacuous.
        run: |
          docker run -d --name pg \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p ${{ matrix.pg.port }}:5432 \
            postgres:${{ matrix.pg.major }}@${{ matrix.pg.digest }} \
            -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done
          docker exec pg pg_isready -U postgres || { echo "Postgres never became ready"; exit 1; }

      - name: Assert the live server is the expected major (substrate wiring)
        # Fail closed if the started container's version does not match the matrix row — a
        # mis-pinned digest or wrong tag is caught BEFORE the suite runs, never a silent
        # green against the wrong version.
        run: |
          got=$(docker exec pg psql -U postgres -tAc "SELECT current_setting('server_version_num')")
          echo "server_version_num=$got"
          major=$(( got / 10000 ))
          test "$major" = "${{ matrix.pg.major }}" \
            || { echo "::error::started PG$major but the matrix row expects PG${{ matrix.pg.major }}"; exit 1; }

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          # Pinned to the dev toolchain (.tool-versions) so the format check,
          # dialyzer PLT, and CI run on the same Elixir/OTP — a version skew here
          # lets the formatter list-wrap heuristic pass in one and fail in the other.
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
            priv/plts
          # Key binds the cache to the pinned toolchain + mix.lock + .tool-versions,
          # so a toolchain or dep bump invalidates a stale PLT/build cache.
          key: ${{ runner.os }}-pg${{ matrix.pg.major }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', '.tool-versions') }}
          restore-keys: ${{ runner.os }}-pg${{ matrix.pg.major }}-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get
      - name: Assert release runtime
        run: |
          mix run --no-start -e '
          unless System.version() == "1.20.3" and :erlang.system_info(:otp_release) == ~c"29" do
            raise "unexpected release runtime"
          end'
      # Supply-chain gate (declared in mix.exs `audit` alias: unused-dep + hex advisory +
      # deps audit). Runs before build so a vulnerable/unpinned dep reds before compile.
      - run: mix audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - name: Run tests and prove this matrix row ran integration against PG${{ matrix.pg.major }}
        # R05 CI discovery: the integration suite emits `R05-SUBSTRATE-RECEIPT pg=<major>` from a
        # live-server test. Grepping for THIS row's major proves the row actually exercised the
        # integration suite against the version it claims — a skipped or mis-wired row (which
        # would print nothing, or a different major) reds here rather than passing vacuously.
        # (pipefail is on in the default Actions bash shell, so a `mix test` failure still fails
        # the step before the grep.)
        run: |
          mix test --warnings-as-errors 2>&1 | tee test-output.log
          # No `^` anchor: ExUnit prints inline progress dots with no trailing newline, so the
          # receipt from IO.puts lands mid-line (`....R05-SUBSTRATE-RECEIPT ...`). The pattern is
          # specific enough that a substring match anywhere is unambiguous.
          grep -qE "R05-SUBSTRATE-RECEIPT pg=${{ matrix.pg.major }} version_num=" test-output.log \
            || { echo "::error::integration did not run against PG${{ matrix.pg.major }} (no R05-SUBSTRATE-RECEIPT)"; exit 1; }
      - run: mix dialyzer

  release-artifact:
    name: docs and package
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Published check mode verifies the local tag and its ancestry against main.
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache dependencies and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-release-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', '.tool-versions') }}

      - run: mix deps.get
      - run: mix audit
      - run: mix compile --warnings-as-errors
      - run: mix docs --warnings-as-errors

      # Build throwaway bytes from the exact commit and run the complete package workflow without
      # retaining a candidate: exact manifest, Hex validation, artifact-derived audit/compile/docs,
      # fresh-consumer provenance + semantic smoke, immutable witness, free-or-coherent published
      # identity checks, and
      # credential-free exact-byte uploader dry-run. The real candidate is minted once, from merged
      # main, after this review set and all matrix rows settle.
      - name: Prove the complete package workflow without minting a candidate
        run: BUILD_DATE=ci bash scripts/release/build_candidate.sh --check

  # The REFERENCE EXAMPLE (examples/replication_pipeline): a docker stack
  # (source PG → replicant release container → destination PG) that is the
  # public sink API's canary — if replicant breaks its consumer surface, the
  # release build, or the substrate wiring, this end-to-end run goes red.
  # Images are the same digest-pinned postgres:18 the matrix pins; the repo-root
  # .dockerignore whitelist is the containment barrier for the build context.
  reference-example:
    name: Reference example (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/replication_pipeline
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          # Same toolchain as the main jobs (.tool-versions) so the example's
          # dialyzer PLT matches the library's.
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache example deps and build
        uses: actions/cache@caa296126883cff596d87d893582f9db880ef25 # v5
        with:
          # The example sets no dialyzer plt_local_path — its PLTs land under
          # _build/dev, so caching _build covers them.
          path: |
            examples/replication_pipeline/deps
            examples/replication_pipeline/_build
          key: example-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('examples/replication_pipeline/mix.lock') }}
          restore-keys: example-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-

      # Static gates for the example project: the "sink API canary" catches
      # static contract drift too — a wrong callback shape or type is red here
      # before the docker build runs.
      - name: Example static gates (format, compile, credo, dialyzer)
        working-directory: examples/replication_pipeline
        run: |
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix credo --strict
          mix dialyzer

      - name: Build and start the stack
        run: docker compose up -d --build

      # The pipeline creates its slot a few seconds after boot; an insert
      # committed BEFORE the slot exists is go-forward-correct but never
      # streamed (the slot's start point is past it). Gate the first insert
      # on the slot existing AND being actively streamed — on a layer-cached
      # build this race is real, and without this gate it is a false red.
      - name: Wait for the pipeline's slot (created and active)
        run: |
          ready=""
          for _ in $(seq 1 30); do
            active=$(docker compose exec -T source-pg psql -U postgres -d example_src \
              -tAc "SELECT count(*) FROM pg_replication_slots WHERE slot_name = 'replicant_example' AND active" 2>/dev/null)
            [ "$active" = "1" ] && ready=1 && break
            sleep 2
          done
          [ "${ready:-0}" = "1" ] \
            || { echo "::error::pipeline never created/activated its slot"; docker compose logs pipeline; exit 1; }

      - name: Assert the substrate is the expected major (PG18)
        run: |
          got=$(docker compose exec -T source-pg psql -U postgres -d example_src \
            -tAc "SELECT current_setting('server_version_num')")
          echo "server_version_num=$got"
          test "$(( got / 10000 ))" = "18" \
            || { echo "::error::expected PG18"; exit 1; }

      - name: Deliver one transaction — replica + checkpoint
        run: |
          docker compose exec -T source-pg psql -U postgres -d example_src \
            -c "INSERT INTO orders (id, note) VALUES (1, 'hello')"
          n=""
          for _ in $(seq 1 30); do
            n=$(docker compose exec -T dest-pg psql -U postgres -d example_dst \
              -tAc "SELECT count(*) FROM orders" 2>/dev/null)
            [ "$n" = "1" ] && break
            sleep 2
          done
          [ "$n" = "1" ] \
            || { echo "::error::row never materialized at the destination"; docker compose logs pipeline; exit 1; }
          # The checkpoint row advanced to the transaction's commit LSN, and
          # the value-free receipts ledger recorded the delivery — exactly one
          # receipt per delivered change, none for a skipped re-delivery.
          docker compose exec -T dest-pg psql -U postgres -d example_dst \
            -tAc "SELECT commit_lsn FROM pipeline_checkpoint WHERE id = 1" | grep -q . \
            || { echo "::error::checkpoint never persisted"; docker compose logs pipeline; exit 1; }
          docker compose exec -T dest-pg psql -U postgres -d example_dst \
            -tAc "SELECT count(*) FROM cdc_receipts WHERE table_name = 'orders' AND op = 'insert'" \
            | grep -qx "1" \
            || { echo "::error::expected exactly 1 insert receipt"; docker compose logs pipeline; exit 1; }

      - name: Unchanged-TOAST sentinel — the untouched column survives the update
        # `payload` is STORAGE EXTERNAL in the source schema, so this UPDATE
        # (touching only `note`) sends the sentinel for `payload`. A sink that
        # wrote the sentinel — or crashed on the omitted column — fails here:
        # the note must be updated AND the destination payload byte-identical.
        run: |
          docker compose exec -T source-pg psql -U postgres -d example_src \
            -c "INSERT INTO orders (id, note, payload) VALUES (2, 'toast-row', repeat('t', 4096))"
          ok=""
          for _ in $(seq 1 30); do
            ok=$(docker compose exec -T dest-pg psql -U postgres -d example_dst \
              -tAc "SELECT count(*) FROM orders WHERE id = 2 AND length(payload) = 4096" 2>/dev/null)
            [ "$ok" = "1" ] && break
            sleep 2
          done
          [ "$ok" = "1" ] \
            || { echo "::error::TOASTed row never materialized"; docker compose logs pipeline; exit 1; }
          docker compose exec -T source-pg psql -U postgres -d example_src \
            -c "UPDATE orders SET note = 'touched' WHERE id = 2"
          touched=""
          for _ in $(seq 1 30); do
            touched=$(docker compose exec -T dest-pg psql -U postgres -d example_dst \
              -tAc "SELECT count(*) FROM orders WHERE id = 2 AND note = 'touched' AND length(payload) = 4096" 2>/dev/null)
            [ "$touched" = "1" ] && break
            sleep 2
          done
          [ "$touched" = "1" ] \
            || { echo "::error::unchanged-TOAST update lost the payload or the note"; docker compose logs pipeline; exit 1; }

      - name: Restart resume — zero duplicate effects
        # The durability proof: restart the pipeline mid-life, deliver a NEW
        # transaction, and assert it lands while the receipts for prior rows
        # are unchanged — the durable checkpoint made the resume effect-once
        # (a re-delivery would double the receipt count).
        run: |
          before=$(docker compose exec -T dest-pg psql -U postgres -d example_dst \
            -tAc "SELECT count(*) FROM cdc_receipts")
          docker compose restart pipeline
          docker compose exec -T source-pg psql -U postgres -d example_src \
            -c "INSERT INTO orders (id, note) VALUES (3, 'after restart')"
          resumed=""
          for _ in $(seq 1 30); do
            resumed=$(docker compose exec -T dest-pg psql -U postgres -d example_dst \
              -tAc "SELECT count(*) FROM orders WHERE id = 3 AND note = 'after restart'" 2>/dev/null)
            [ "$resumed" = "1" ] && break
            sleep 2
          done
          [ "$resumed" = "1" ] \
            || { echo "::error::post-restart row never arrived"; docker compose logs pipeline; exit 1; }
          after=$(docker compose exec -T dest-pg psql -U postgres -d example_dst \
            -tAc "SELECT count(*) FROM cdc_receipts")
          expected=$((before + 1))
          [ "$after" = "$expected" ] \
            || { echo "::error::expected $expected receipts after resume (had $before), got $after"; docker compose logs pipeline; exit 1; }

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans
