name: Quick

# Give work branches feedback before landing. The qualified check on kci/** decides landing.
on:
  push:
    branches-ignore: [main, 'kci/**']

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quick:
    runs-on: ubuntu-24.04
    # 2x (244 s uncached engine suite minus 12 s for its pglogical companion, run
    # 46076846281, plus 6 s for format, compile and Credo, runs 46076846281 and 46136138758).
    timeout-minutes: 8
    env:
      MIX_ENV: test
    steps:
      # The selector needs the merge base with the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/toolchain
        id: toolchain

      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}

      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.toolchain.outputs.otp }}-${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.toolchain.outputs.otp }}-${{ steps.toolchain.outputs.elixir }}-

      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict

      - name: Select the tests that cover this branch
        id: select
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          selected=$(elixir scripts/quick_tests.exs "origin/$DEFAULT_BRANCH")
          echo "selected: $selected"
          echo "tests=$selected" >> "$GITHUB_OUTPUT"

      - name: Read the declared PostgreSQL lanes
        if: steps.select.outputs.tests != 'none'
        id: lanes
        run: scripts/ci/postgres-lanes.sh

      # The pglogical companion starts only when the selection holds pglogical tests,
      # which the engine (no plugins) excludes; qualification runs them the same way.
      - name: Select the engine lane
        if: steps.select.outputs.tests != 'none'
        id: engine
        env:
          POSTGRES_MATRIX: ${{ steps.lanes.outputs.matrix }}
          TESTS: ${{ steps.select.outputs.tests }}
        run: |
          pglogical=false
          if [ "$TESTS" = all ]; then
            pglogical=true
          else
            read -ra files <<< "$TESTS"
            if grep -qlE '@(module)?tag :pglogical' "${files[@]}"; then pglogical=true; fi
          fi
          if [ "$pglogical" = true ]; then
            lane=$(jq -ce '.pg[] | select(.kind == "engine")' <<< "$POSTGRES_MATRIX")
          else
            lane=$(jq -ce '.pg[] | select(.kind == "engine") | del(.plugin_server)' <<< "$POSTGRES_MATRIX")
          fi
          {
            echo "lane=$lane"
            echo "plugins=$(jq -r '.plugins | join(",")' <<< "$lane")"
            echo "companion-plugins=$(jq -r '.plugin_server.plugins // [] | join(",")' <<< "$lane")"
          } >> "$GITHUB_OUTPUT"

      - name: Start the pinned PostgreSQL engine
        if: steps.engine.outputs.lane != ''
        uses: ./.github/actions/postgres
        with:
          lane: ${{ steps.engine.outputs.lane }}

      # A pass that runs no test (every selected test excluded on this substrate) is a
      # failure, not a green run.
      - name: Test the selected files
        if: steps.engine.outputs.lane != ''
        env:
          TESTS: ${{ steps.select.outputs.tests }}
          # Throwaway container fixtures, matching qualification.
          REPLICANT_TEST_URL: postgres://postgres:postgres@127.0.0.1:15432/replicant_test
          COMPANION_URL: postgres://postgres:postgres@127.0.0.1:15434/replicant_test
          EXPECTED_PG_MAJOR: ${{ steps.lanes.outputs.engine-major }}
          ENGINE_PLUGINS: ${{ steps.engine.outputs.plugins }}
          COMPANION_PLUGINS: ${{ steps.engine.outputs.companion-plugins }}
        run: |
          files=()
          [ "$TESTS" = all ] || read -ra files <<< "$TESTS"
          ran() {
            python3 -c 'import re,sys
          t=sys.stdin.read()
          m=re.search(r"(\d+) tests?, \d+ failures?(?:, (\d+) excluded)?(?:, (\d+) skipped)?", t)
          print(0 if not m else int(m.group(1))-int(m.group(2) or 0)-int(m.group(3) or 0))' < "$1"
          }
          EXPECTED_PG_PLUGINS="$ENGINE_PLUGINS" mix test --warnings-as-errors "${files[@]}" 2>&1 | tee engine.log
          total=$(ran engine.log)
          if [ -n "$COMPANION_PLUGINS" ]; then
            REPLICANT_TEST_URL="$COMPANION_URL" EXPECTED_PG_PLUGINS="$COMPANION_PLUGINS" \
              mix test --warnings-as-errors --only pglogical "${files[@]}" 2>&1 | tee companion.log
            total=$((total + $(ran companion.log)))
          fi
          echo "tests run: $total"
          [ "$total" -gt 0 ] || { echo "::error::the selected tests all were excluded; nothing ran"; exit 1; }

      - name: Remove PostgreSQL and its disposable data
        if: always() && steps.engine.outputs.lane != ''
        uses: ./.github/actions/postgres
        with:
          mode: stop
