name: Pull request

# An outside pull request runs the same qualification jobs as a landing candidate, under
# the "pull request /" prefix and a final "pull request checked" job. These checks inform
# review; they are not the landing verdict (that is ci.yml's `qualified` on kci/<commit>),
# and they receive no secrets.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: pull request
    uses: ./.github/workflows/qualification.yml

  checked:
    name: pull request checked
    if: always()
    needs: [checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PY
