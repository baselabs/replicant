name: Publish to Hex

# Infra dispatches on main. Its ruleset is the publication prerequisite.
# After Hex read-back, infra tags and creates the GitHub release from release-assets.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HEX_VERSION: "2.7.0"

concurrency:
  group: publish
  cancel-in-progress: false

# Every run step uses bash -eo pipefail, so a failure behind a pipe fails its step
# (the infrastructure CI requirements). Scripts the jobs call set -euo pipefail themselves.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
    steps:
      - name: Require a dispatch on main
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Refuse a first publication
        run: |
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' https://hex.pm/api/packages/replicant)" || {
            echo "::error::Could not read the Hex package; publication refused"
            exit 1
          }
          case "$status" in
            200) ;;
            404)
              echo "::error::The name replicant is not on Hex; a first publication is the owner's decision"
              exit 1 ;;
            *)
              echo "::error::Hex package lookup failed; publication refused"
              exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        id: toolchain

      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}

      - name: Refuse a missing, duplicated or empty release changelog section
        run: >-
          elixir -r scripts/release/release_notes.exs
          -e 'Replicant.ReleaseNotes.verify_changelog!("mix.exs", "CHANGELOG.md")'

      - run: mix local.hex "$HEX_VERSION" --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked

      - name: Compare two package builds and inspect one docs build
        id: archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release/build_candidate.sh "$RUNNER_TEMP/replicant-release"
          version="$(grep -oE '@version "[^"]+"' mix.exs | head -1 | sed -E 's/@version "([^"]+)"/\1/')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Run from a directory without mix.exs: from the checkout, Mix would load and
      # compile the project under the key, and Hex's modules would leave the code path.
      - name: Upload the inspected archives
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_VERSION: ${{ steps.archives.outputs.version }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: >-
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/release/publish_hex_artifacts.exs" "$PACKAGE_VERSION"
          "$RUNNER_TEMP/replicant-release/package.tar" "$RUNNER_TEMP/replicant-release/docs.tar.gz"

      - name: Read back served archives and prove docs provenance without a key
        id: read_back
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_VERSION: ${{ steps.archives.outputs.version }}
        run: >-
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/release/retain_release_assets.exs" "$PACKAGE_VERSION"
          "$RUNNER_TEMP/replicant-release/package.tar" "$RUNNER_TEMP/replicant-release/release-assets"

      - name: Retain verified release assets for infra
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/replicant-release/release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Remove built release archives
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/replicant-release"
