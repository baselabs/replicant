name: Publish to Hex

# Release only the archives produced by qualification on the selected commit.
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full lowercase SHA of the qualified commit to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

# Every run step uses bash -eo pipefail, so a failure behind a pipe fails its step
# (the infrastructure CI requirements). Scripts the jobs call set -euo pipefail themselves.
defaults:
  run:
    shell: bash

jobs:
  upload:
    name: Upload qualified archives
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      qualification-run: ${{ steps.release.outputs.qualification-run }}
      qualification-sha256: ${{ steps.release.outputs.qualification-sha256 }}
    steps:
      - &release_ref
        name: Require default-branch dispatch and a full release SHA
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      # Run setup only from the dispatched workflow revision. Treat the selected
      # commit's toolchain file as data, and replace the checkout before the action.
      - &tooling_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/beam/
            /.github/actions/toolchain/
            /scripts/toolchain.sh

      - &release_versions
        name: Read toolchain data from the release commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git --no-replace-objects merge-base --is-ancestor "$RELEASE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"
          git --no-replace-objects show "$RELEASE_COMMIT:.tool-versions" > "$RUNNER_TEMP/replicant-release-versions"

      - &toolchain
        uses: ./.github/actions/toolchain
        id: toolchain
        with:
          path: ${{ runner.temp }}/replicant-release-versions

      - &beam
        uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}
          install-hex: 'false'

      - &hex
        name: Install the shared action's pinned Hex
        working-directory: ${{ runner.temp }}
        env:
          HEX_VERSION: ${{ steps.toolchain.outputs.hex }}
        run: |
          pin="$(curl --fail --silent --show-error --max-time 30 https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version)"
          [[ "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$pin" == "$HEX_VERSION" ]]
          mix local.hex "$pin" --force

      - &release_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        id: release
        with:
          operation: upload
          package: replicant
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          organization-read-key: ${{ secrets.HEX_ORG_KEY_PUBLISH_API_READ }}

      - name: Remove release toolchain data
        if: always()
        run: rm -f -- "$RUNNER_TEMP/replicant-release-versions"

  read-back:
    name: Read back release
    needs: upload
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - *release_ref
      - *tooling_checkout
      - *release_versions
      - *toolchain
      - *beam
      - *hex
      - *release_checkout

      - uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        id: release
        with:
          operation: read-back
          package: replicant
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.upload.outputs.qualification-run }}
          qualification-sha256: ${{ needs.upload.outputs.qualification-sha256 }}
          release-assets-directory: ${{ runner.temp }}/release-assets

      - name: Retain verified release assets for infra
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Remove release scratch files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/replicant-release-versions"
